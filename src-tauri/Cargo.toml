[package]
name = "queenui"
version = "0.1.5"
description = "A modern chess engine and Lichess bot operations desktop app"
authors = ["QueenUI contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "queenui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
queen-core = { path = "../crates/queen-core" }
queen-client = { path = "../crates/queen-client" }
queen-protocol = { path = "../crates/queen-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["serde", "v4"] }
rand = "0.9.2"
ts-rs = { version = "11", features = ["serde-compat"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
queen-core = { path = "../crates/queen-core", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
