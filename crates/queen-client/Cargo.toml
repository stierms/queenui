[package]
name = "queen-client"
version = "0.1.5"
description = "Rust client for a QueenUI headless runner"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
queen-core = { path = "../queen-core" }
queen-protocol = { path = "../queen-protocol" }
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = "0.26"
