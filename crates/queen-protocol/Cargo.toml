[package]
name = "queen-protocol"
version = "0.1.5"
description = "Versioned wire contracts for QueenUI runners"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
queen-core = { path = "../queen-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "11", features = ["serde-compat"] }
uuid = { version = "1", features = ["serde", "v4"] }
