[package]
name = "queen-core"
version = "0.1.1"
description = "Portable QueenUI game, engine, and persistence core"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "form", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["serde", "v4"] }
flate2 = "1.1"
regex = "1.13"
polyglot-book-rs = "0.1.0"
shakmaty = "=0.30.0"
pgn-reader = "0.29.0"
rand = "0.9.2"
fs2 = "0.4"
httpdate = "1"
ts-rs = { version = "11", features = ["serde-compat"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["test-util"] }
