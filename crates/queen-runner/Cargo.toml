[package]
name = "queen-runner"
version = "0.1.4"
description = "Headless QueenUI game and engine runner"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
queen-core = { path = "../queen-core" }
queen-protocol = { path = "../queen-protocol" }
axum = { version = "0.8", features = ["json", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
rcgen = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
queen-core = { path = "../queen-core", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
